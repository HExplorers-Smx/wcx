name: Manual Build

# 手动触发：在 GitHub Actions 页面点 "Run workflow"，勾选要构建的架构和变体
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: "入口变体"
        type: choice
        default: standard
        options:
          - standard
          - legacy
      build_type:
        description: "构建类型"
        type: choice
        default: release
        options:
          - release
          - debug
      arm64:
        description: "构建 arm64-v8a（现代手机）"
        type: boolean
        default: true
      arm32:
        description: "构建 armeabi-v7a（老设备）"
        type: boolean
        default: true
      universal:
        description: "构建通用包（体积大，包含所有架构）"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FLAVOR: ${{ github.event.inputs.flavor }}
      BUILD_TYPE: ${{ github.event.inputs.build_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          workspaces: . -> target

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt update -qq
          sudo apt install -y gcc-multilib || true

      - name: Build native library
        run: |
          cargo xtask configure
          cargo xtask build --native-only

      - name: Prepare keystore
        run: |
          KS_FILE="$RUNNER_TEMP/wekit-keystore.jks"
          CRED_FILE="$RUNNER_TEMP/keystore-creds.env"

          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$KS_FILE"
            for STORE_TYPE in PKCS12 JKS; do
              if keytool -list -keystore "$KS_FILE" \
                   -storetype "$STORE_TYPE" \
                   -storepass "${{ secrets.STORE_PASSWORD }}" \
                   -alias "${{ secrets.KEY_ALIAS }}" >/dev/null 2>&1; then
                echo "Using project keystore"
                echo "KS_PASS=${{ secrets.STORE_PASSWORD }}" > "$CRED_FILE"
                echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$CRED_FILE"
                echo "KEY_PASS=${{ secrets.KEY_PASSWORD }}" >> "$CRED_FILE"
                exit 0
              fi
            done
          fi

          # 没有配置 secrets 就生成临时调试签名
          echo "Generating temporary CI keystore"
          keytool -genkeypair -v \
            -keystore "$KS_FILE" -storetype PKCS12 -alias wcx \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass wcx-store-pass -keypass wcx-store-pass \
            -dname "CN=WCX CI, OU=CI, O=Johnny520, L=CI, S=CI, C=CN"
          echo "KS_PASS=wcx-store-pass" > "$CRED_FILE"
          echo "KEY_ALIAS=wcx" >> "$CRED_FILE"
          echo "KEY_PASS=wcx-store-pass" >> "$CRED_FILE"

      - name: Build APK
        env:
          WEKIT_KEYSTORE_FILE: ${{ runner.temp }}/wekit-keystore.jks
        run: |
          source "$RUNNER_TEMP/keystore-creds.env"
          export WEKIT_KEYSTORE_PASSWORD="$KS_PASS"
          export WEKIT_KEY_ALIAS="$KEY_ALIAS"
          export WEKIT_KEY_PASSWORD="$KEY_PASS"
          TASK="assemble$(echo $FLAVOR | sed 's/.*/\u&/')$(echo $BUILD_TYPE | sed 's/.*/\u&/')"
          echo "Running task: $TASK"
          ./gradlew "$TASK" --warning-mode all --stacktrace

      - name: Stage selected APKs
        run: |
          mkdir -p dist
          ABI_DIR="app/build/outputs/apk/${FLAVOR}/${BUILD_TYPE}"

          # 根据勾选决定拷贝哪些 ABI
          if [ "${{ github.event.inputs.arm64 }}" = "true" ]; then
            cp -v "$ABI_DIR"/*arm64-v8a*.apk dist/ || true
          fi
          if [ "${{ github.event.inputs.arm32 }}" = "true" ]; then
            cp -v "$ABI_DIR"/*armeabi-v7a*.apk dist/ || true
          fi
          if [ "${{ github.event.inputs.universal }}" = "true" ]; then
            cp -v "$ABI_DIR"/*universal*.apk dist/ || true
          fi

          # debug 包没有按 abi split 的话，把所有 apk 都拷过去
          if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
            cp -v "$ABI_DIR"/*.apk dist/ || true
          fi

          ls -lh dist/

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: wcx-${{ github.event.inputs.flavor }}-${{ github.event.inputs.build_type }}
          path: dist/*.apk
